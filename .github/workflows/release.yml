name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, vX.Y.Z
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The cross-platform and browser suites check out github.ref, which is the tag
  # only for a tag push. A manual run tests the tagged source in the publish job.
  tests:
    if: github.event_name == 'push'
    uses: ./.github/workflows/test.yml

  publish:
    needs: tests
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Verify the tag matches every version file and the changelog
        run: python3 scripts/release.py check --tag "$TAG"
      - name: Run the tests on the tagged source
        run: python3 -m unittest discover -v
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install pinned Bun build runtime
        run: npm install --global bun@1.2.22
      - name: Build the optional terminal UI
        working-directory: ui
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run check
          bun run test
          bun run build
      - name: Build assets and verify the tag matches VERSION
        run: python3 scripts/build_release.py --tag "$TAG" --with-ui
      - name: Write release notes from the changelog section
        run: python3 scripts/release.py notes --tag "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Publish the stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python3 scripts/release.py version)"
          ASSETS=(dist/agent_usage.py "dist/aisad-skill-$TAG.zip" dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Republishing keeps whichever release is already marked Latest.
            gh release edit "$TAG" --title "AISAD ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --verify-tag --latest --title "AISAD ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
